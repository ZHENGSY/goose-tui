name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Goose v2026.3 is the version this tree is tested against. Bump it
          # here and in README.md together.
          - os: ubuntu-latest
            asset: goose-v2026.3-linux-x64.tar.gz
          - os: macos-latest
            asset: goose-v2026.3-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-goose
        with:
          asset: ${{ matrix.asset }}

      - name: Toolchain
        run: goose toolchain

      - name: Typecheck, unit tests, examples, pty
        run: sh tests/run.sh
