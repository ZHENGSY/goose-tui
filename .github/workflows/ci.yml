name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Goose v2026.3 is the version this tree is tested against. Bump it
          # here and in README.md together.
          - os: ubuntu-latest
            asset: goose-v2026.3-linux-x64.tar.gz
          - os: macos-latest
            asset: goose-v2026.3-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Goose
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -eu
          url="https://github.com/aardappel/goose/releases/download/v2026.3/$ASSET"
          curl -fsSL -o "$RUNNER_TEMP/goose.tar.gz" "$url"
          mkdir -p "$RUNNER_TEMP/goose"
          tar -xzf "$RUNNER_TEMP/goose.tar.gz" -C "$RUNNER_TEMP/goose"
          # The macOS release asks for this after a browser download; harmless
          # otherwise, and cheap insurance against a quarantined archive.
          if [ "$(uname)" = Darwin ]; then
            xattr -dr com.apple.quarantine "$RUNNER_TEMP/goose" || true
          fi
          # The archive layout has changed before; find the binary instead of
          # assuming a directory name. The standard library sits beside it.
          bin=$(find "$RUNNER_TEMP/goose" -maxdepth 3 -type f -name goose | head -1)
          test -n "$bin"
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: goose toolchain

      - name: Typecheck, unit tests, examples, pty
        run: sh tests/run.sh
