name: release

# A release is for humans and for people who want to try the framework without
# installing a toolchain. Goose packages are consumed straight from a tag, so
# nothing here is required to use goose-tui: `import tui from
# "ZHENGSY/goose-tui@v0.1.0"` already works with no artifact at all.
#
# The assets are the two demo programs built with --standalone, which puts the
# Goose runtime inside the executable: download, untar, run. Building them here
# also proves that `goose build` works on both platforms, every tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  demo:
    name: demo (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: goose-v2026.3-linux-x64.tar.gz
            slug: linux-x64
          - os: macos-latest
            asset: goose-v2026.3-macos-arm64.tar.gz
            slug: macos-arm64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/install-goose
        with:
          asset: ${{ matrix.asset }}

      - name: Build the demos
        run: |
          set -eu
          mkdir -p dist
          for pair in todo:05_todo dashboard:06_dashboard; do
            out=${pair%%:*}
            src=${pair#*:}
            goose build --standalone -o "dist/$out" "examples/$src.goose"
          done
          ls -l dist

      - name: Smoke test the binaries
        run: |
          set -eu
          for b in todo dashboard; do
            out=$("./dist/$b" --dump --cols 60 --rows 20)
            test -n "$out"
            printf '%s\n' "$out" | head -2
          done

      - name: Package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -eu
          name="goose-tui-demo-$TAG-$SLUG"
          cp README.md dist/README.md
          tar -czf "$name.tar.gz" -C dist todo dashboard README.md
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.slug }}
          path: |
            goose-tui-demo-*.tar.gz
            goose-tui-demo-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: demo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          # The tag has to be a real tag: a release made from a branch would
          # ship binaries that no `import ...@tag` can reach.
          test -n "$(git tag --points-at HEAD)" || {
            echo "no tag points at $(git rev-parse --short HEAD)"; exit 1; }

          version=${TAG#v}
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && index($0, "## [") == 1 { exit }
            f
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > body.md
          fi

          cat >> body.md <<'EOF'

          ### Downloads

          These are the two demo programs, built with the Goose runtime inside
          them, for people who want to look before installing anything. Unpack
          and run `./todo` or `./dashboard`; `--dump` prints one frame instead.

          ```sh
          tar -xzf goose-tui-demo-*-macos-arm64.tar.gz
          ./todo
          ```

          macOS quarantines a downloaded binary; if it refuses to start,
          `xattr -d com.apple.quarantine todo` (same for `dashboard`). A
          `.sha256` file sits beside each archive.

          The framework itself is the tag, not an asset:

          ```goose
          import tui from "ZHENGSY/goose-tui@<this tag>";
          ```

          Source archives are under "Assets" below, generated by GitHub.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" \
              --title "goose-tui ${TAG#v}" \
              --notes-file body.md
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
